<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0076B6">
<title>Brain Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap">
<style>
/* Layout: iOS-style single column. Translucent top bar, big titles, grouped cards, floating tab bar.
   Palette: Honolulu blue and silver by day, deep-space navy by night. */
:root{
  --bg:#EAF4FB; --bg2:#CDE5F4; --card:#FFFFFF; --card2:#F2F8FC; --ink:#0B2233; --mute:#4B6174; --line:rgba(10,60,100,.14);
  --accent:#0076B6; --accent-ink:#FFFFFF; --accent-soft:#D6EBF8; --lilac:#2F5F8A;
  --good:#12875B; --good-bg:#DDF6EA; --warn:#B85200; --warn-bg:#FFEBD6; --gold:#FFB400; --spark:rgba(0,118,182,.35);
  --shadow:0 8px 28px rgba(0,118,182,.14),0 1px 3px rgba(10,40,70,.08); --bar:rgba(242,248,252,.82);
  --f-ui:-apple-system,BlinkMacSystemFont,'SF Pro Rounded','SF Pro Display','Inter',system-ui,'Segoe UI',sans-serif;
  --f-num:'SF Mono','JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#07131D; --bg2:#0B3552; --card:#0F2434; --card2:#16324A; --ink:#EAF4FB; --mute:#9DB6C9; --line:rgba(255,255,255,.12);
  --accent:#3DA9E0; --accent-ink:#04202F; --accent-soft:#12384F; --lilac:#8FB3D6;
  --good:#4FD39B; --good-bg:#10382B; --warn:#FFAA5C; --warn-bg:#3F2610; --gold:#FFD24D; --spark:rgba(255,255,255,.7);
  --shadow:0 10px 30px rgba(0,0,0,.4); --bar:rgba(8,20,30,.82); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#07131D; --bg2:#0B3552; --card:#0F2434; --card2:#16324A; --ink:#EAF4FB; --mute:#9DB6C9; --line:rgba(255,255,255,.12);
  --accent:#3DA9E0; --accent-ink:#04202F; --accent-soft:#12384F; --lilac:#8FB3D6;
  --good:#4FD39B; --good-bg:#10382B; --warn:#FFAA5C; --warn-bg:#3F2610; --gold:#FFD24D; --spark:rgba(255,255,255,.7);
  --shadow:0 10px 30px rgba(0,0,0,.4); --bar:rgba(8,20,30,.82); color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background-color:var(--bg);
  background-image:radial-gradient(120% 60% at 15% 0%,var(--bg2),transparent 60%),radial-gradient(1.6px 1.6px at 18px 24px,var(--spark),transparent),radial-gradient(1.1px 1.1px at 66px 72px,var(--spark),transparent);
  background-size:auto,96px 96px,96px 96px;background-attachment:fixed,scroll,scroll;
  color:var(--ink);font:500 17px/1.45 var(--f-ui);padding-inline:16px;padding-block:0 120px;min-height:100vh}
#app{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em;text-wrap:balance;line-height:1.12}
h1{font-size:2.1rem} h2{font-size:1.5rem} h3{font-size:1.1rem}
p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* top bar */
.navbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-inline:-16px;padding:12px 16px 10px;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}
.navbar .mid{font-weight:800;font-size:1.02rem;text-align:center;flex:1;min-width:0}
.back{display:inline-flex;align-items:center;gap:2px;color:var(--accent);font-weight:700;min-height:44px;padding-right:8px}
.back svg{width:22px;height:22px}
.largehead{padding-top:18px;display:flex;flex-direction:column;gap:2px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 12px;font-weight:800;font-size:.82rem}
.pill.plain{background:var(--card2);color:var(--mute);border:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good)}
.dot.off{background:var(--gold)}

/* cards and buttons */
.card{background:var(--card);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.btn{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:13px 26px;font-weight:800;font-size:1.04rem;min-height:50px}
.btn.tint{background:var(--accent-soft);color:var(--accent)}
.btn.quiet{background:var(--card2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
@media(prefers-reduced-motion:no-preference){.btn,.choice,.mode,.tab,.swatch,.item{transition:transform .12s ease,box-shadow .12s}.btn:active,.choice:active,.mode:active,.item:active{transform:scale(.97)}}

/* home */
.hero{background:linear-gradient(140deg,#0076B6,#0A3D6B);color:#fff;border-radius:28px;padding:20px;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:center;box-shadow:var(--shadow)}
.hero .who{display:flex;flex-direction:column;gap:2px;min-width:0}
.hero .who h2{color:#fff}
.hero .who span{opacity:.9;font-weight:600;font-size:.95rem}
.hero .av{width:104px;height:112px;background:rgba(255,255,255,.22);border-radius:26px;display:grid;place-items:center;overflow:hidden}
.stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.stat{background:rgba(255,255,255,.2);border-radius:16px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:1.5rem;font-weight:800;line-height:1.1}
.stat span{font-weight:700;font-size:.78rem;opacity:.92}
.journey{grid-column:1/-1;background:rgba(10,4,30,.38);border-radius:18px;padding:12px 12px 8px;margin-top:4px}
.journey svg{width:100%;display:block}
.journey text{fill:#fff;font-family:var(--f-ui);font-size:9.5px;font-weight:700}
.journey p{font-size:.9rem;font-weight:700;margin-top:2px}
.sect{font-weight:800;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);padding:6px 6px 0}
.modes{display:flex;flex-direction:column;gap:10px}
.mode{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;text-align:left;background:var(--card);border-radius:22px;padding:14px 16px;box-shadow:var(--shadow);min-height:84px}
.mode .ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.mode .ic svg{width:30px;height:30px}
.mode.lead .ic{background:var(--accent);color:var(--accent-ink)}
.mode h3{font-size:1.12rem}
.mode span.d{color:var(--mute);font-size:.92rem;display:block}
.mode .go{color:var(--mute);width:20px;height:20px}
.spark{background:var(--card2);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:4px;box-shadow:inset 0 0 0 1px var(--line)}
.spark b{color:var(--accent);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em}

/* bracelet */
.bracelet{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:6px 0;position:relative}
.bead{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1.15rem;color:#fff;background:var(--accent);box-shadow:inset 0 -4px 0 rgba(0,0,0,.14),0 2px 6px rgba(0,118,182,.3)}
.bead:nth-child(3n+2){background:var(--lilac)}
.bead:nth-child(3n){background:#FF9A3C}
.bead.off{background:var(--card2);color:var(--mute);box-shadow:inset 0 0 0 2px var(--line)}
.dl{display:flex;flex-direction:column;gap:8px;font-size:.92rem}
.dl div{display:flex;gap:10px;align-items:baseline}
.dl b{min-width:112px}
.dl .off{opacity:.55}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-top:1px solid var(--line)}
.tabbar>div{display:flex;gap:6px;width:100%;max-width:720px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mute);font-weight:700;font-size:.72rem;min-height:52px;border-radius:14px}
.tab svg{width:26px;height:26px}
.tab.on{color:var(--accent)}

/* run */
.track{position:relative;height:48px;margin-top:2px}
.track .lane{position:absolute;left:0;right:0;top:34px;height:8px;border-radius:99px;background:var(--accent-soft);overflow:hidden}
.track .lane i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--lilac));border-radius:99px;transition:width .4s}
.track .kart{position:absolute;top:0;width:56px;transition:left .4s}
.track .flag{position:absolute;right:0;top:6px;width:22px;height:30px}
.score{display:flex;gap:8px;align-items:center;font-weight:800}
.qtext{font-family:var(--f-num);font-weight:700;font-size:clamp(1.9rem,8vw,2.8rem);line-height:1.25;overflow-wrap:anywhere}
.qtext.word{font-family:var(--f-ui);font-weight:700;font-size:1.3rem;line-height:1.45}
.stack{display:inline-grid;align-self:flex-start;font-family:var(--f-num);font-weight:700;font-size:clamp(2.1rem,9vw,3.1rem);line-height:1.3;border-bottom:4px solid var(--ink);padding:0 4px 4px;min-width:5ch}
.stack>div{display:flex;justify-content:space-between;gap:1.2ch}
.stack>div:first-child{justify-content:flex-end}
.pill.timer{background:var(--accent-soft);color:var(--accent);font-size:.95rem;min-width:64px;justify-content:center}
.pill.timer.warn{background:var(--warn-bg);color:var(--warn)}
.tbar{height:6px;border-radius:99px;background:var(--accent-soft);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--accent);transition:width 1s linear}
.tbar i.warn{background:var(--warn)}
.paper{background:var(--warn-bg);color:var(--warn);border-radius:16px;padding:10px 14px;font-weight:700;font-size:.93rem}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.choice{background:var(--card2);box-shadow:inset 0 0 0 2px var(--line);border-radius:20px;padding:16px;font-family:var(--f-num);font-weight:700;font-size:1.65rem;min-height:70px}
.choice:hover:not(:disabled){box-shadow:inset 0 0 0 3px var(--accent)}
.choice.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 3px var(--accent)}
.choice.bad{background:var(--warn-bg);box-shadow:inset 0 0 0 3px var(--warn);opacity:.7}
.choice.ok{background:var(--good-bg);box-shadow:inset 0 0 0 3px var(--good)}
input.ans{font-family:var(--f-num);font-weight:700;font-size:2rem;width:100%;max-width:280px;padding:10px 16px;border:0;border-radius:18px;background:var(--card2);box-shadow:inset 0 0 0 2px var(--line);color:var(--ink)}
.fb{border-radius:18px;padding:12px 16px;font-weight:800}
.fb.good{background:var(--good-bg);color:var(--good)}
.fb.try{background:var(--warn-bg);color:var(--warn)}
.steps{background:var(--card2);border-radius:18px;padding:14px 16px 14px 36px;margin:0;display:flex;flex-direction:column;gap:6px;box-shadow:inset 0 0 0 1px var(--line)}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav button{width:42px;height:42px;border-radius:12px;background:var(--card2);box-shadow:inset 0 0 0 2px var(--line);font-family:var(--f-num);font-weight:700}
.nav button.done{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.nav button.cur{background:var(--accent);color:var(--accent-ink)}
.bigscore{font-family:var(--f-num);font-weight:800;font-size:3.2rem;line-height:1}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;height:120px}
.podium div{width:84px;border-radius:14px 14px 0 0;background:var(--accent-soft);color:var(--mute);text-align:center;font-weight:800;padding-top:8px}
.podium .me{background:linear-gradient(var(--accent),var(--lilac));color:var(--accent-ink)}
details{background:var(--card2);border-radius:18px;padding:12px 16px;box-shadow:inset 0 0 0 1px var(--line)}
summary{cursor:pointer;font-weight:800}

/* closet */
.avbig{display:grid;place-items:center;background:linear-gradient(160deg,var(--accent-soft),var(--card2));border-radius:28px;padding:10px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:44px;height:44px;border-radius:50%;box-shadow:inset 0 0 0 3px var(--card),0 0 0 1px var(--line)}
.swatch.on{box-shadow:inset 0 0 0 3px var(--card),0 0 0 3px var(--accent)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{background:var(--card2);border-radius:18px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px;box-shadow:inset 0 0 0 2px var(--line);min-height:76px}
.item.on{box-shadow:inset 0 0 0 3px var(--accent);background:var(--accent-soft)}
.item.lock{opacity:.55}
.item small{color:var(--mute);font-weight:700}

/* parent */
.seg{display:flex;background:var(--card2);border-radius:14px;padding:3px;box-shadow:inset 0 0 0 1px var(--line)}
.seg button{flex:1;padding:9px 6px;border-radius:11px;font-weight:700;font-size:.92rem;min-height:40px;color:var(--mute)}
.seg.wrap{flex-wrap:wrap}.seg.wrap button{flex:1 1 30%}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.bar{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) 52px;gap:10px;align-items:center;font-size:.92rem}
.bar .track2{background:var(--accent-soft);border-radius:8px;height:14px;overflow:hidden}
.bar .fill{display:block;height:100%;background:var(--accent);border-radius:8px}
.bar .fill.low{background:var(--warn)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-size:.76rem;text-transform:uppercase;letter-spacing:.06em}
.chart text{fill:var(--mute);font-family:var(--f-ui);font-size:11px;font-weight:700}
select,input.txt{font:inherit;padding:8px 14px;border:0;border-radius:14px;background:var(--card2);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line);min-height:44px}
/* chips, skills, spelling */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:999px;padding:8px 14px;font-weight:800;font-size:.9rem;min-height:40px;background:var(--card2);color:var(--mute);box-shadow:inset 0 0 0 2px var(--line)}
.chip.on{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.skill{background:var(--card);border-radius:20px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);min-height:84px;min-width:0}
.skill b{font-size:1rem;line-height:1.25}
.skill .track2{background:var(--accent-soft);border-radius:8px;height:8px;overflow:hidden}
.skill .fill{display:block;height:100%;background:var(--accent);border-radius:8px}
.skill .fill.low{background:var(--warn)}
.skill small{color:var(--mute);font-weight:700}
.arr{display:grid;gap:4px;align-self:flex-start;padding:4px 0}
.arr i{width:14px;height:14px;border-radius:50%;background:var(--accent)}
.wchips{display:flex;flex-wrap:wrap;gap:8px}
.wchip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 14px;font-weight:700;background:var(--card2);box-shadow:inset 0 0 0 2px var(--line);min-height:40px}
.wchip i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.wchip i.m{background:var(--good)} .wchip i.l{background:var(--gold)} .wchip i.t{background:var(--warn)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--mute);font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.bigword{font-size:clamp(2.4rem,11vw,3.6rem);font-weight:800;letter-spacing:.04em;text-align:center;padding:14px 8px;background:var(--accent-soft);border-radius:22px;overflow-wrap:anywhere}
.bigword b{color:var(--accent)}
.dashes{font-family:var(--f-num);font-size:2rem;letter-spacing:.3em;text-align:center;color:var(--mute);padding:10px 0;overflow-wrap:anywhere}
input.ans.w{font-family:var(--f-ui);max-width:460px;font-size:1.6rem;letter-spacing:.03em}
.lts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.lt{width:clamp(30px,8.6vw,46px);height:clamp(40px,11vw,56px);border-radius:12px;display:grid;place-items:center;font-family:var(--f-num);font-weight:800;font-size:clamp(1.3rem,5.5vw,1.9rem);background:var(--card2);box-shadow:inset 0 0 0 2px var(--line)}
.lt.blank{background:transparent;box-shadow:inset 0 -4px 0 var(--mute)}
.lt.cur{box-shadow:inset 0 -4px 0 var(--accent);background:var(--accent-soft)}
.lt.good{background:var(--good-bg);color:var(--good);box-shadow:inset 0 0 0 2px var(--good)}
.lt.bad{background:var(--warn-bg);color:var(--warn);box-shadow:inset 0 0 0 2px var(--warn)}
button.lt{cursor:pointer;padding:0}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tile{min-width:56px;height:60px;border-radius:16px;font-family:var(--f-num);font-weight:800;font-size:1.7rem;background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 2px var(--line)}
.tile:hover:not(:disabled){box-shadow:inset 0 0 0 3px var(--accent)}
.tile:disabled{opacity:.25;cursor:default}
.tile.bad{background:var(--warn-bg);color:var(--warn);opacity:.55}
.tile.hintt{box-shadow:inset 0 0 0 4px var(--gold)}
.diff{font-family:var(--f-num);font-weight:700;font-size:1.3rem;display:flex;flex-direction:column;gap:4px;overflow-wrap:anywhere}
.diff .x{color:var(--warn);text-decoration:underline wavy}
.diff .m{color:var(--good);background:var(--good-bg);border-radius:4px;padding:0 2px}
.diff small{font-family:var(--f-ui);color:var(--mute);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}
.choices.w .choice{font-family:var(--f-ui);font-size:1.3rem}
.chk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-weight:700}
.chk .y{color:var(--good)}.chk .n{color:var(--warn)}
textarea.txt{font:inherit;padding:12px 14px;border:0;border-radius:14px;background:var(--card2);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line);width:100%;min-height:76px;resize:vertical}
.hunt{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:2px;touch-action:none;user-select:none;-webkit-user-select:none}
.hc{aspect-ratio:1;display:grid;place-items:center;border-radius:7px;background:var(--card2);font-family:var(--f-num);font-weight:800;font-size:clamp(.78rem,3.3vw,1.2rem);cursor:pointer}
.hc.sel{background:var(--accent);color:var(--accent-ink)}
.hc.f0{background:rgba(0,118,182,.4)}.hc.f1{background:rgba(142,92,255,.42)}.hc.f2{background:rgba(255,154,60,.5)}.hc.f3{background:rgba(58,182,255,.45)}.hc.f4{background:rgba(39,194,138,.45)}.hc.f5{background:rgba(255,210,77,.55)}
.hc.hintc{box-shadow:inset 0 0 0 3px var(--gold)}
.hw{border-radius:12px;padding:6px 12px;font-weight:700;background:var(--card2);box-shadow:inset 0 0 0 2px var(--line);font-size:.95rem}
.hw.on{text-decoration:line-through;background:var(--good-bg);color:var(--good);box-shadow:none}
.hwl{display:flex;flex-wrap:wrap;gap:8px}
.hwl.clues{flex-direction:column}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media(prefers-reduced-motion:reduce){.shake{animation:none}}
.tabbar .tab{font-size:.66rem}
.tabbar>div{gap:2px}.tabbar .tab{font-size:.62rem}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tcard{--dc:#999;text-align:left;background:var(--card);border-radius:18px;padding:12px 12px 12px 16px;display:flex;flex-direction:column;gap:5px;box-shadow:var(--shadow),inset 6px 0 0 var(--dc);min-height:92px;min-width:0}

<div id="app"></div>
<script>
"use strict";
/* ---------- helpers ---------- */
const $app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[ri(0,a.length-1)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const dg=n=>[n%10,Math.floor(n/10)%10,Math.floor(n/100)];
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const dayKey=ts=>new Date(ts).toLocaleDateString('en-CA');
const fmtDate=ts=>new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'});

/* ---------- problem types ---------- */
/*GEN-START*/
const SKILLS = {
  words:{name:'Number words'},
  mul_round:{name:'Thousands × hundreds'},
  mul_multi:{name:'Multi-digit multiplication'},
  divword:{name:'Division word problems'},
  divrem:{name:'Division with remainders'},
  mode:{name:'Mode'}, mean:{name:'Mean'}, median:{name:'Median'}, range:{name:'Range'},
  addfrac:{name:'Adding unlike fractions'}, simplify:{name:'Simplifying fractions'},
  gcf:{name:'Greatest common factor'}, lcm:{name:'Least common multiple'}, factors:{name:'Counting factors'}
};
const SKILL_ORDER = Object.keys(SKILLS);
const BLUEPRINT = ['words','words','mul_round','mul_multi','divword','divword','divrem','divrem','divrem','divrem','mode','mean','median','range','addfrac','addfrac','gcf','lcm','simplify','factors'];

function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function fmt(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,',');}
function gcd(a,b){while(b){const t=a%b;a=b;b=t;}return a;}
function lcmOf(a,b){return a/gcd(a,b)*b;}
function factorsOf(n){const f=[];for(let i=1;i<=n;i++)if(n%i===0)f.push(i);return f;}
function sortNum(a){return a.slice().sort((x,y)=>x-y);}

const ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function words999(n){const s=[];if(n>=100){s.push(ONES[Math.floor(n/100)]+' hundred');n%=100;}if(n>0){if(n<20)s.push(ONES[n]);else s.push(TENS[Math.floor(n/10)]+(n%10?'-'+ONES[n%10]:''));}return s.join(' ');}
function numberToWords(n){const t=Math.floor(n/1000),r=n%1000;const out=[];if(t)out.push(words999(t)+' thousand');if(r)out.push(words999(r));return out.join(' ');}

function divSteps(dv,d){
  const ds=String(dv).split('').map(Number);let cur=0,started=false,qs='';const steps=[];
  for(let i=0;i<ds.length;i++){
    cur=cur*10+ds[i];
    if(!started&&cur<d)continue;
    const first=!started;started=true;
    const qd=Math.floor(cur/d),prod=qd*d;
    steps.push((first?`Start with the first ${i+1} digit${i?'s':''}: ${cur}.`:`Bring down the ${ds[i]} to make ${cur}.`)+` ${d} goes into ${cur} ${qd} time${qd===1?'':'s'} (${qd} × ${d} = ${prod}). Subtract: ${cur} − ${prod} = ${cur-prod}.`);
    qs+=qd;cur-=prod;
  }
  return {steps,q:Number(qs),r:cur};
}

const num=(v,m)=>({t:fmt(v),m});
const GEN = {
  words(){
    const t=Math.random()<.25?rnd(10,99):rnd(101,999);
    let r;const z=Math.random();
    if(z<.2)r=rnd(1,9)*100+rnd(1,9);else if(z<.35)r=rnd(1,9)*10;else if(z<.45)r=rnd(1,9)*100;else r=rnd(101,999);
    const n=t*1000+r;
    const s3=String(r).padStart(3,'0'),s2=String(t);
    const swapLast=Number(s3[0]+s3[2]+s3[1]);
    const swapFirst=Number(s2.slice(0,-2)+s2[s2.length-1]+s2[s2.length-2]);
    const cands=[
      num(t*1000+swapLast,'swapped two digits in the last group'),
      num(Number(s2.slice(0,-2)+s2[s2.length-1]+s2[s2.length-2])*1000+r,'swapped two digits in the thousands group'),
      num(r*1000+t,'put the two groups in the wrong order'),
      num(n*10,'wrote an extra zero (ten times too big)'),
      num(Math.floor(n/10),'left out a digit'),
      num(Number(String(t)+String(r)),'skipped the zero placeholder')
    ];
    return {skill:'words',text:`Which number is written in words as: “${numberToWords(n)}”?`,ans:fmt(n),cands,
      pad:()=>num(n+pick([-1,1])*pick([10,100,1000]),'put a digit in the wrong place value'),
      steps:[`Find the word “thousand”. Everything before it is the thousands group: ${numberToWords(t)} = ${t}.`,
        `Everything after it is the ones group: ${numberToWords(r)} = ${r}. Use a 0 for any empty place, so write it with 3 digits: ${s3}.`,
        `Put the groups together with a comma between: ${fmt(n)}.`],
      meta:{n,t,r}};
  },
  mul_round(){
    const a=rnd(2,9),b=rnd(2,9),A=a*1000,B=b*100,ans=A*B;
    return {skill:'mul_round',text:`${fmt(A)} × ${fmt(B)} = ?`,ans:fmt(ans),
      cands:[num(ans/10,'dropped a zero'),num(ans*10,'added an extra zero'),num(ans/100,'only counted the zeros from one number'),num(A+B,'added instead of multiplied'),num(a*b*1000,'forgot some of the zeros')],
      pad:()=>num(ans+pick([-1,1])*pick([1000,10000,100000]),'counted the zeros wrong'),
      steps:[`Multiply the digits that are not zeros: ${a} × ${b} = ${a*b}.`,
        `Count the zeros: ${fmt(A)} has 3 and ${fmt(B)} has 2, so 5 zeros go on the end.`,
        `${a*b} followed by 5 zeros is ${fmt(ans)}.`],
      meta:{a,b,A,B}};
  },
  mul_multi(){
    let n,m,ones,tens;
    do{n=rnd(Math.random()<.5?1000:100,Math.random()<.5?3999:999);m=rnd(12,49);ones=m%10;tens=Math.floor(m/10);}while(ones===0||n%10===0);
    const ans=n*m,p1=n*ones,p2=n*tens;
    return {skill:'mul_multi',text:`${fmt(n)} × ${m} = ?`,ans:fmt(ans),
      cands:[num(p1+p2,'forgot the placeholder zero'),num(p2*10,'only multiplied by the tens digit'),num(p1,'only multiplied by the ones digit'),num(ans-100,'forgot a regrouped digit'),num(ans+1000,'added a regrouped digit in the wrong place')],
      pad:()=>num(ans+pick([-1,1])*pick([10,100,1000]),'regrouping slip'),
      steps:[`Multiply by the ones digit: ${fmt(n)} × ${ones} = ${fmt(p1)}.`,
        `Multiply by the tens digit. Put a 0 placeholder first: ${fmt(n)} × ${tens}0 = ${fmt(p2*10)}.`,
        `Add the two parts: ${fmt(p1)} + ${fmt(p2*10)} = ${fmt(ans)}.`],
      meta:{n,m}};
  },
  divword(){
    const full=Math.random()<.5;
    const d=rnd(9,24);let q=Math.random()<.3?rnd(100,400):rnd(12,99);
    const r=full?rnd(1,d-1):0;
    while(q*d+r>9999)q=Math.floor(q/2)+1;
    const dv=q*d+r;
    const ex=[
      `A youth football camp has ${fmt(dv)} cones to share equally among ${d} practice fields. How many cones go on each field?`,
      `A stadium store packed ${fmt(dv)} foam fingers into ${d} equal boxes. How many foam fingers are in each box?`,
      `${fmt(dv)} fans filled ${d} buses with the same number of fans on each bus. How many fans rode on each bus?`,
      `A team handed out ${fmt(dv)} water bottles equally to ${d} players over the season. How many bottles did each player get?`];
    const fu=[
      `A snack stand has ${fmt(dv)} pretzels. Each bag holds exactly ${d} pretzels. How many full bags can be filled?`,
      `A school ordered ${fmt(dv)} pencils. Each box holds ${d} pencils. How many full boxes can be made?`,
      `A coach has ${fmt(dv)} stickers. Each helmet needs ${d} stickers. How many helmets can be finished?`];
    const ds=divSteps(dv,d);
    const cands=[num(dv*d,'multiplied instead of divided'),num(dv-d,'subtracted instead of divided'),num(dv+d,'added instead of divided'),
      num(q+10,'slip in one subtraction step'),num(q>10?q-10:q+20,'slip in one subtraction step'),num(q*10,'put a digit in the wrong place')];
    if(full){cands.unshift(num(q+1,'rounded up even though the last group is not full'));cands.unshift(num(r,'gave the leftover instead of the number of full groups'));}
    return {skill:'divword',text:pick(full?fu:ex),ans:fmt(q),cands,
      pad:()=>num(q+pick([-2,-1,1,2]),'small slip in the division'),
      steps:[full?`“How many full” means divide and keep only the whole groups: ${fmt(dv)} ÷ ${d}.`:`Words like “equally” and “each” tell us to divide: ${fmt(dv)} ÷ ${d}.`]
        .concat(ds.steps,[full?`${q} full groups with ${r} left over. The leftover is not a full group, so the answer is ${fmt(q)}.`:`Nothing is left over, so the answer is ${fmt(q)}.`]),
      meta:{dv,d,q,r,full}};
  },
  divrem(){
    const d=rnd(6,39);const r=rnd(1,d-1);
    const q=rnd(20,Math.min(300,Math.floor((9999-r)/d)));
    const dv=q*d+r,ds=divSteps(dv,d);
    const cands=[{t:`${q}`,m:'dropped the remainder'},{t:`${q+1} R ${r}`,m:'rounded the quotient up'},
      {t:`${q-1} R ${r+d}`,m:'stopped one step early (the remainder is bigger than the divisor)'},
      {t:`${q} R ${d-r}`,m:'used divisor minus remainder'},{t:`${q+10} R ${r}`,m:'slip in one subtraction step'},
      {t:`${q-10} R ${r}`,m:'slip in one subtraction step'},{t:`${r} R ${q}`,m:'swapped the quotient and remainder'}];
    return {skill:'divrem',text:`${fmt(dv)} ÷ ${d} = ?  (Give the quotient and the remainder.)`,ans:`${q} R ${r}`,cands,
      pad:()=>({t:`${q+pick([2,3,-2,-3])} R ${r}`,m:'small slip in the division'}),
      steps:ds.steps.concat([`Nothing more to bring down. The quotient is ${q} and the remainder is ${r}. Check: ${q} × ${d} + ${r} = ${fmt(dv)}. Answer: ${q} R ${r}.`]),
      meta:{dv,d,q,r}};
  },
  mode(){
    const n=rnd(7,9),m=rnd(2,40),f=rnd(3,4);
    const arr=Array(f).fill(m),cnt={};
    while(arr.length<n){const v=rnd(1,45);if(v===m)continue;if((cnt[v]||0)>=f-1)continue;cnt[v]=(cnt[v]||0)+1;arr.push(v);}
    const list=shuffle(arr),srt=sortNum(arr),med=srt[Math.floor(n/2)];
    return {skill:'mode',text:`Find the mode of: ${list.join(', ')}`,ans:String(m),
      cands:[num(Math.max(...arr),'picked the largest number'),num(med,'found the median instead'),num(f,'gave how many times it appears'),num(Math.max(...arr)-Math.min(...arr),'found the range instead'),num(Math.min(...arr),'picked the smallest number')],
      pad:()=>num(rnd(1,45),'picked a number that appears less often'),
      steps:[`The mode is the number that appears most often. Put the list in order to make counting easy: ${srt.join(', ')}.`,
        `Count each number. ${m} appears ${f} times and every other number appears fewer times.`,
        `The mode is ${m}.`],
      meta:{list,m}};
  },
  mean(){
    let arr,m,n;
    for(;;){
      n=rnd(4,6);m=rnd(8,60);const sum=m*n;arr=[];
      for(let i=0;i<n-1;i++)arr.push(Math.max(1,m+rnd(-15,15)));
      const last=sum-arr.reduce((a,b)=>a+b,0);
      if(last>=1&&last<=99&&new Set(arr.concat([last])).size>1){arr.push(last);break;}
    }
    const sum=m*n,srt=sortNum(arr),med=n%2?srt[(n-1)/2]:(srt[n/2-1]+srt[n/2])/2;
    return {skill:'mean',text:`Find the mean of: ${arr.join(', ')}`,ans:String(m),
      cands:[num(sum,'added but forgot to divide'),num(med,'found the median instead'),num(Math.max(...arr)-Math.min(...arr),'found the range instead'),num(m+1,'addition slip'),num(m-1,'addition slip'),num(m+10,'addition slip')],
      pad:()=>num(m+pick([-3,-2,2,3]),'addition slip'),
      steps:[`Add all ${n} numbers: ${arr.join(' + ')} = ${sum}.`,`Divide the total by how many numbers there are: ${sum} ÷ ${n} = ${m}.`,`The mean is ${m}.`],
      meta:{arr,m}};
  },
  median(){
    let arr,srt,med,even;
    for(;;){
      even=Math.random()<.35;const n=even?pick([4,6,8]):pick([5,7,9]);
      arr=[];for(let i=0;i<n;i++)arr.push(rnd(1,99));srt=sortNum(arr);
      if(even){if((srt[n/2-1]+srt[n/2])%2)continue;med=(srt[n/2-1]+srt[n/2])/2;}else med=srt[(n-1)/2];
      const mid=even?arr[n/2-1]:arr[(n-1)/2];
      if(mid===med||new Set(arr).size<n-1)continue;break;
    }
    const n=arr.length,mid=even?arr[n/2-1]:arr[(n-1)/2],sum=arr.reduce((a,b)=>a+b,0);
    const cands=[num(mid,'picked the middle number without putting the list in order'),num(Math.max(...arr)-Math.min(...arr),'found the range instead')];
    if(sum%n===0)cands.push(num(sum/n,'found the mean instead'));
    if(even){cands.push(num(srt[n/2],'picked only one of the two middle numbers'));cands.push(num(srt[n/2-1],'picked only one of the two middle numbers'));}
    else{cands.push(num(srt[(n-1)/2+1],'counted one place too far'));cands.push(num(srt[(n-1)/2-1],'counted one place too short'));}
    return {skill:'median',text:`Find the median of: ${arr.join(', ')}`,ans:String(med),cands,
      pad:()=>num(med+pick([-3,-2,2,3]),'slip when finding the middle'),
      steps:[`Put the numbers in order from least to greatest: ${srt.join(', ')}.`,
        even?`There are ${n} numbers, so two are in the middle: ${srt[n/2-1]} and ${srt[n/2]}. The median is halfway between them: (${srt[n/2-1]} + ${srt[n/2]}) ÷ 2 = ${med}.`
            :`There are ${n} numbers. The middle one has the same count on each side: ${med}.`,
        `The median is ${med}.`],
      meta:{arr}};
  },
  range(){
    let arr;
    do{const n=rnd(5,8);arr=[];for(let i=0;i<n;i++)arr.push(rnd(1,99));}while(Math.max(...arr)-Math.min(...arr)<10);
    const mx=Math.max(...arr),mn=Math.min(...arr),r=mx-mn,srt=sortNum(arr),med=srt[Math.floor(srt.length/2)];
    return {skill:'range',text:`Find the range of: ${arr.join(', ')}`,ans:String(r),
      cands:[num(mx,'gave the largest number'),num(mx+mn,'added instead of subtracted'),num(med,'found the median instead'),num(r+10,'subtraction slip'),num(r-10,'subtraction slip'),num(mn,'gave the smallest number')],
      pad:()=>num(r+pick([-2,-1,1,2]),'subtraction slip'),
      steps:[`Put the numbers in order: ${srt.join(', ')}.`,`The biggest is ${mx} and the smallest is ${mn}.`,`Range = biggest − smallest = ${mx} − ${mn} = ${r}.`],
      meta:{arr}};
  },
  addfrac(){
    const D=[2,3,4,5,6,8,10,12];
    for(;;){
      const b=pick(D),d=pick(D);if(b===d)continue;
      const a=rnd(1,b-1),c=rnd(1,d-1),L=lcmOf(b,d),x=a*(L/b),y=c*(L/d),nm=x+y,g=gcd(nm,L);
      if(nm>=L)continue;
      const n0=nm/g,d0=L/g,ans=`${n0}/${d0}`;
      const cands=[{t:`${a+c}/${b+d}`,m:'added the tops and the bottoms'},{t:`${a+c}/${L}`,m:'found the common denominator but did not rescale the tops'},
        {t:`${a+c}/${b*d}`,m:'added the tops and multiplied the bottoms'},{t:`${nm}/${L}`,m:'did not simplify'},
        {t:`${a*d+c*b}/${b*d}`,m:'did not simplify'},{t:`${a+c}/${Math.max(b,d)}`,m:'kept one of the denominators'}];
      return {skill:'addfrac',text:`${a}/${b} + ${c}/${d} = ?`,ans,cands,
        pad:()=>({t:`${n0+pick([1,2])}/${d0}`,m:'slip when adding the tops'}),
        steps:[`Find a common denominator: the least common multiple of ${b} and ${d} is ${L}.`,
          `Rewrite each fraction: ${a}/${b} = ${x}/${L} and ${c}/${d} = ${y}/${L}.`,
          `Add the tops and keep the bottom: ${x} + ${y} = ${nm}, so the sum is ${nm}/${L}.`,
          g>1?`Simplify by dividing the top and bottom by ${g}: ${nm}/${L} = ${ans}. Answer: ${ans}.`:`${nm}/${L} cannot be simplified. Answer: ${ans}.`],
        meta:{a,b,c,d}};
    }
  },
  simplify(){
    const g=pick([2,3,4,5,6,8,9,10,12]);let n0,d0;
    do{d0=rnd(2,9);n0=rnd(1,d0-1);}while(gcd(n0,d0)!==1);
    const n=n0*g,d=d0*g,ans=`${n0}/${d0}`;
    const cands=[{t:`${n/g}/${d}`,m:'divided only the top'},{t:`${n}/${d/g}`,m:'divided only the bottom'},{t:`${n-g}/${d-g}`,m:'subtracted instead of dividing'},{t:`${d0}/${n0}`,m:'flipped the fraction'}];
    factorsOf(g).filter(p=>p>1&&p<g).forEach(p=>cands.unshift({t:`${n/p}/${d/p}`,m:'divided by a common factor, but not the greatest one'}));
    return {skill:'simplify',text:`Simplify ${n}/${d} as far as possible.`,ans,cands,
      pad:()=>({t:`${n0+pick([1,2])}/${d0+pick([0,1])}`,m:'changed the value of the fraction'}),
      steps:[`Find the greatest common factor of ${n} and ${d}. It is ${g}.`,`Divide the top and the bottom by ${g}: ${n} ÷ ${g} = ${n0} and ${d} ÷ ${g} = ${d0}.`,`The simplified fraction is ${ans}.`],
      meta:{n,d}};
  },
  gcf(){
    let g,x,y;
    do{g=rnd(2,12);x=rnd(2,9);y=rnd(2,9);}while(x===y||gcd(x,y)!==1||g*Math.max(x,y)>96);
    const a=g*x,b=g*y,l=lcmOf(a,b);
    const cands=[num(l,'found the least common multiple instead'),num(1,'only found the factor 1'),num(Math.min(a,b),'picked the smaller number'),num(x,'listed a factor of only one number')];
    factorsOf(g).filter(p=>p>1&&p<g).forEach(p=>cands.unshift(num(p,'found a common factor, but not the greatest')));
    const fa=factorsOf(a),fb=factorsOf(b),common=fa.filter(f=>fb.includes(f));
    return {skill:'gcf',text:`What is the greatest common factor (GCF) of ${a} and ${b}?`,ans:String(g),cands,
      pad:()=>num(g+pick([-1,1,2]),'missed a factor'),
      steps:[`List the factors of ${a}: ${fa.join(', ')}.`,`List the factors of ${b}: ${fb.join(', ')}.`,`The factors they share are ${common.join(', ')}. The greatest is ${g}.`],
      meta:{a,b}};
  },
  lcm(){
    let a,b;
    do{a=rnd(2,12);b=rnd(2,12);}while(a===b||a%b===0||b%a===0);
    const l=lcmOf(a,b),g=gcd(a,b);
    const ma=[],mb=[];for(let v=a;v<=l;v+=a)ma.push(v);for(let v=b;v<=l;v+=b)mb.push(v);
    return {skill:'lcm',text:`What is the least common multiple (LCM) of ${a} and ${b}?`,ans:String(l),
      cands:[num(g,'found the greatest common factor instead'),num(a*b,'multiplied the numbers (not always the least)'),num(l*2,'stopped at a common multiple that is not the least'),num(a+b,'added the numbers'),num(Math.max(a,b),'picked the larger number')],
      pad:()=>num(l+pick([-2,-1,1,2])*Math.min(a,b),'missed the first shared multiple'),
      steps:[`List multiples of ${a}: ${ma.join(', ')}.`,`List multiples of ${b}: ${mb.join(', ')}.`,`The first number in both lists is ${l}.`],
      meta:{a,b}};
  },
  factors(){
    const N=pick([12,18,20,24,28,30,36,40,42,45,48,50,60]);
    const f=factorsOf(N),c=f.length;
    return {skill:'factors',text:`How many factors does ${N} have?`,ans:String(c),
      cands:[num(c-2,'left out 1 and the number itself'),num(c-1,'missed one factor'),num(c+1,'counted a factor twice'),num(c+2,'counted extra numbers')],
      pad:()=>num(c+pick([3,4,-3]),'counting slip'),
      steps:[`Look for pairs that multiply to ${N}: ${f.filter(v=>v*v<=N).map(v=>`${v} × ${N/v}`).join(', ')}.`,`List every number from the pairs in order: ${f.join(', ')}.`,`Count them: ${N} has ${c} factors.`],
      meta:{N}};
  }

function makeQuestion(skill){
  const q=GEN[skill]();
  const seen=new Map();
  for(const c of shuffle(q.cands)){
    if(c.t===q.ans||/^-|NaN|undefined|Infinity/.test(c.t)||c.t==='0')continue;
    if(seen.has(c.t)){const e=seen.get(c.t);if(!e.m.includes(c.m))e.m.push(c.m);}
    else seen.set(c.t,{t:c.t,m:[c.m]});
  }
  const wrong=Array.from(seen.values());
  let guard=0;
  while(wrong.length<3&&guard++<200){
    const c=q.pad();
    if(c.t===q.ans||/^-|NaN|undefined|Infinity/.test(c.t)||c.t==='0'||wrong.some(w=>w.t===c.t))continue;
    wrong.push({t:c.t,m:[c.m]});
  }
  const choices=shuffle([{t:q.ans,ok:true,m:''}].concat(wrong.slice(0,3).map(w=>({t:w.t,ok:false,m:w.m.join(' / ')}))));
  return {skill,text:q.text,ans:q.ans,choices,all:wrong.map(w=>({t:w.t,m:w.m.join(' / ')})),steps:q.steps,hints:q.steps.slice(0,-1),meta:q.meta};
}

function planTypes(mode,n){
  const act=activeTypes();
  if(mode==='smart'){
    const acc=typeAcc(stats().items,20);
    const w=act.map(k=>{const a=acc[k];return a.n<3?(PRIOR[k]||2):0.5+3*(1-a.c/a.n)});
    const out=[];
    for(let i=0;i<n;i++){let r=Math.random()*w.reduce((x,y)=>x+y,0),k=0;while(r>w[k]&&k<w.length-1){r-=w[k];k++}out.push(act[k])}
    return out;
  }
  const base=act.flatMap(k=>Array(WEIGHT[k]||1).fill(k));
  let out=shuffle(base);
  while(out.length<n)out=out.concat(shuffle(base));
  return out.slice(0,n);
}

const EXAM_SECS=180;
function timerOn(){return S.settings.examTimer!==false}
const fmtT=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const leftSecs=r=>Math.max(0,Math.ceil((EXAM_SECS*1000-r.used[r.i])/1000));
const isLocked=r=>r.mode==='exam'&&timerOn()&&r.used[r.i]>=EXAM_SECS*1000;
function examPill(r){
  if(!timerOn())return'<span class="pill plain">Match day</span>';
  const l=leftSecs(r);
  return`<span class="pill timer ${l<=30?'warn':''}" id="timer" aria-live="off">${l===0?"Time's up":'<span class="num">'+fmtT(l)+'</span>'}</span>`;
}
function timerBar(r){const l=leftSecs(r);return`<div class="tbar"><i id="tbar" class="${l<=30?'warn':''}" style="width:${Math.round(100*l/EXAM_SECS)}%"></i></div>`}
setInterval(()=>{
  if(!run)return;
  const now=Date.now(),d=now-run.tickAt;run.tickAt=now;
  if(run.mode!=='exam'||!timerOn()||S.view!=='run'||run.review||!run.started)return;
  const i=run.i;if(run.used[i]>=EXAM_SECS*1000)return;
  run.used[i]=Math.min(EXAM_SECS*1000,run.used[i]+d);
  const l=leftSecs(run),el=document.getElementById('timer'),bar=document.getElementById('tbar');
  if(el){el.classList.toggle('warn',l<=30);el.innerHTML=l===0?"Time's up":'<span class="num">'+fmtT(l)+'</span>'}
  if(bar){bar.classList.toggle('warn',l<=30);bar.style.width=Math.round(100*l/EXAM_SECS)+'%'}
  if(l===0){render();setTimeout(()=>{if(run&&run.i===i&&!run.review&&S.view==='run')act('next')},1500)}
},1000);

function wordLevel(att){
  if(!att||!att.length)return'n';
  const clean=a=>a.ok&&!a.h;
  if(att.length>=2&&clean(att[0])&&clean(att[1]))return'm';
  if(!att[0].ok||att.slice(0,3).filter(a=>!clean(a)).length>=2)return't';
  return'l';
}
const canSpeak=()=>'speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined';
let voice=null;
function pickVoice(){
  if(voice)return voice;
  try{const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]US/i.test(v.lang));
    voice=vs.find(v=>/samantha|ava|allison|zira|jenny|aria|google us/i.test(v.name))||vs[0]||null}catch(e){}
  return voice;
}
function say(...parts){
  if(!canSpeak())return;
  try{
    const ss=window.speechSynthesis;ss.cancel();
    parts.forEach((t,k)=>{if(!t)return;const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=k===1?.9:.8;const v=pickVoice();if(v)u.voice=v;ss.speak(u)});
  }catch(e){}
}

function nflInfo(list){
  const att={};
  list.slice().sort((a,b)=>a.ts-b.ts).forEach(s=>(s.items||[]).forEach(i=>{if(i.k)(att[i.k]=att[i.k]||[]).push({ok:!!i.ok,h:!!i.h,c:i.c})}));
  const mastered=new Set(),level={};
  for(const k in att){
    let run=[],ever=false;
    att[k].forEach(x=>{if(x.ok&&!x.h)run.push(x);else run=[];if(run.length>=2&&run.some(r=>r.c!=='conf'))ever=true});
    if(ever)mastered.add(k);
    const lv=wordLevel(att[k].slice().reverse());
    level[k]=ever&&lv!=='t'?'m':lv==='m'?'l':lv;
  }
  const teamsM=TEAMS.filter(t=>mastered.has(t.id));
  const divsDone=DIVS.filter(d=>teamsIn(d).every(t=>mastered.has(t.id)));
  const confsDone=['AFC','NFC'].filter(c=>TEAMS.filter(t=>t.conf===c).every(t=>mastered.has(t.id)));
  const rulesM=RULES.filter(r=>mastered.has('r:'+r.id));
  const all=teamsM.length===TEAMS.length;
  const bonus=divsDone.length*10+confsDone.length*25+(all?50:0)+Math.floor(rulesM.length/8)*5;
  return{att,mastered,level,teamsM,divsDone,confsDone,rulesM,all,bonus};
}

function hotCount(items){let run=0,n=0;items.forEach(i=>{if(i.ok&&!i.h){run++;if(run%5===0)n++}else run=0});return n}
function nflAward(items){
  const today=nflSess().filter(s=>dayKey(s.ts)===fbDay());
  if(today.length>=NFL_DAILY)return{parts:[],total:0,capped:true};
  const correct=items.filter(i=>i.ok).length,parts=[['Right answers',correct],['Kickoff bonus',2]];
  if(items.length>=4&&items.every(i=>i.ok&&!i.h))parts.push(['Perfect game',5]);
  const hot=hotCount(items);if(hot)parts.push(['Hot streak x'+hot,hot*2]);
  if(!today.length)parts.push(['Daily double',3]);
  return{parts,total:parts.reduce((n,p)=>n+p[1],0),capped:false};
}

  if(kind==='div')return{k:t.id,c:'div',prompt:`Which division are the ${nick} in?`,opts:shuffle([d,...shuffle(DIVS.filter(x=>x!==d)).slice(0,3)]),ans:d,why:`The ${nick} play in the ${d}.`};
  if(kind==='who'){
    const same=TEAMS.some(x=>x.id!==t.id&&x.place===t.place);
    if(!same)return{k:t.id,c:'who',prompt:`Which team plays in ${t.place}?`,opts:shuffle([nick,...shuffle(TEAMS.filter(x=>x.id!==t.id&&x.st!==t.st)).slice(0,3).map(x=>x.nick)]),ans:nick,why:`The ${t.name} play in ${t.place}.`};
    kind='loc';
  }
  if(kind==='mates'){
    const others=TEAMS.filter(x=>divOf(x)!==d);
    return{k:t.id,c:'mates',prompt:`Which team is in the ${d}?`,opts:shuffle([nick,...shuffle(others).slice(0,3).map(x=>x.nick)]),ans:nick,why:`The ${nick} are in the ${d}. The division also has ${teamsIn(d).filter(x=>x.id!==t.id).map(x=>x.nick).join(', ')}.`};
  }
  const sts=[...new Set(TEAMS.map(x=>x.st))].filter(s=>s!==t.st);
  return{k:t.id,c:'loc',prompt:`In which state do the ${nick} play?`,opts:shuffle([t.st,...shuffle(sts).slice(0,3)]),ans:t.st,why:`The ${nick} play in ${t.place}.${t.note?' '+t.note:''}`};
}
function weightedPick(items,wf,n){
  const pool=items.slice(),out=[];
  while(out.length<n&&pool.length){
    const ws=pool.map(wf),tot=ws.reduce((a,b)=>a+b,0);let r=Math.random()*tot,j=0;
    while(j<pool.length-1&&r>ws[j]){r-=ws[j];j++}
    out.push(pool.splice(j,1)[0]);
  }
  return out;
}
const LV_W={n:3,t:3.5,l:2,m:.6};
function pickTeamQs(n){
  const inf=nflInfo(nflSess());
  const ts=weightedPick(TEAMS,t=>LV_W[inf.level[t.id]||'n'],n);
  const kinds=['conf','div','div','div','loc','loc','loc','who','mates','mates'];
  return ts.map(t=>teamQ(t,pick(kinds)));
}
function pickRules(n){
  const inf=nflInfo(nflSess());
  return weightedPick(RULES,r=>LV_W[inf.level['r:'+r.id]||'n'],n).map(r=>({k:'r:'+r.id,c:'rules',prompt:r.q,opts:r.opts.length===4?shuffle(r.opts):r.opts,ans:r.a,why:r.why}));
}
let nq=null,fd=null,fbres=null;
function startQuiz(game){
  const qs=game==='rules'?pickRules(8):pickTeamQs(10);
  S.from='fb';
  nq={game,qs,i:0,t0:Date.now(),st:qs.map(()=>({tries:0,wrong:[],done:false,ok:false,h:false,cheer:''}))};
  S.view='nqrun';render();
}
function nqPick(idx){
  const q=nq.qs[nq.i],st=nq.st[nq.i];
  if(st.done)return;
  const v=q.opts[idx];if(v===undefined||st.wrong.includes(v))return;
  st.tries++;
  if(v===q.ans){st.done=true;st.ok=true;st.h=st.tries>1;st.cheer=pick(FB_CHEERS)}
  else{st.wrong.push(v);if(q.opts.length<=2||st.tries>=2){st.done=true;st.ok=false}}
}
function startDraft(){
  const inf=nflInfo(nflSess());
  const ds=weightedPick(DIVS,d=>1+teamsIn(d).reduce((n,t)=>n+LV_W[inf.level[t.id]||'n'],0),4);
  const rounds=ds.map(d=>{
    const ans=teamsIn(d).map(t=>t.id);
    const decoys=shuffle(TEAMS.filter(t=>divOf(t)!==d)).slice(0,4).map(t=>t.id);
    return{div:d,ans,show:shuffle([...ans,...decoys]),sel:new Set(),tries:0,done:false,ok:false,msg:null,bad:[]};
  });
  S.from='fb';
  fd={rounds,i:0,t0:Date.now()};
  S.view='fdrun';render();
}
function fdToggle(id){
  const r=fd.rounds[fd.i];if(r.done||r.bad.includes(id))return;
  if(r.sel.has(id))r.sel.delete(id);else if(r.sel.size<4)r.sel.add(id);
  r.msg=null;
}
function fdCheck(){
  const r=fd.rounds[fd.i];if(r.done||r.sel.size!==4)return;
  r.tries++;
  const right=[...r.sel].filter(id=>r.ans.includes(id));
  if(right.length===4){r.done=true;r.ok=true;r.msg='right';r.cheer=pick(FB_CHEERS)}
  else if(r.tries>=2){r.done=true;r.msg='reveal'}
  else{r.msg='retry';r.bad=[...r.sel].filter(id=>!r.ans.includes(id));r.sel=new Set(right)}
}
function finishNfl(game,items,missed){
  const infoB=nflInfo(nflSess()),before=stats().stars;
  const aw=nflAward(items);
  const correct=items.filter(i=>i.ok).length;
  const started=game==='draft'?fd.t0:nq.t0;
  const sess={ts:Date.now(),mode:'nfl',home:S.home||'',correct,total:items.length,secs:Math.min(7200,Math.round((Date.now()-started)/1000)),stars:aw.total,
    items:items.map(i=>({t:'nfl',g:game,c:i.c,k:i.k,ok:i.ok,h:i.h||0,err:null}))};
  const hadItems=ITEMS.filter(x=>x.nfl&&nflHas(x.id,infoB)).map(x=>x.id);
  saveSession(sess);
  const infoA=nflInfo(nflSess()),now=stats().stars;
  const fresh=(a,b)=>a.filter(x=>!b.includes(x));
  fbres={game,sess,aw,missed,
    cards:fresh(infoA.teamsM.map(t=>t.id),infoB.teamsM.map(t=>t.id)).map(id=>teamById(id).name),
    divs:fresh(infoA.divsDone,infoB.divsDone),confs:fresh(infoA.confsDone,infoB.confsDone),
    allNow:infoA.all&&!infoB.all,rulesNew:infoA.rulesM.length-infoB.rulesM.length,
    milestone:infoA.bonus-infoB.bonus,
    items:ITEMS.filter(x=>x.nfl&&nflHas(x.id,infoA)&&!hadItems.includes(x.id)).map(x=>x.name).concat(ITEMS.filter(x=>!x.nfl&&x.at>before&&x.at<=now).map(x=>x.name)),
    stops:STOPS.filter(p=>p.at>0&&p.at>before&&p.at<=now).map(p=>p.n)};
  S.view='fbres';render();
}
function finishQuiz(){
  const items=nq.qs.map((q,i)=>({k:q.k,c:q.c,ok:nq.st[i].ok,h:nq.st[i].h?1:0}));
  const missed=nq.qs.map((q,i)=>({q,st:nq.st[i]})).filter(x=>!x.st.ok).map(x=>({prompt:x.q.prompt,ans:x.q.ans,why:x.q.why}));
  finishNfl(nq.game,items,missed);
}
function finishDraft(){
  const items=[],missed=[];
  fd.rounds.forEach(r=>{
    r.ans.forEach(id=>{
      const ok=r.ok||r.sel.has(id);
      items.push({k:id,c:'draft',ok,h:r.tries>1||(!r.ok)?1:0});
      if(!ok)missed.push({prompt:`${r.div}: ${teamById(id).name}`,ans:r.div,why:`The ${teamById(id).nick} play in the ${r.div}.`});
    });
  });
  finishNfl('draft',items,missed);
}

function progressTab(){
  const st=stats();
  if(!S.sessions.length)return`<section class="card"><h3>No sessions yet</h3><p class="mute">Once Emmett finishes a session, scores, mistake patterns and practice days show up here for both homes.</p></section>`;
  const acc=typeAcc(st.items,40);
  const goal=Number(S.settings.goal)||80;
  const errs={};st.items.filter(i=>i.err).forEach(i=>errs[i.err]=(errs[i.err]||0)+1);
  const errRows=Object.entries(errs).sort((a,b)=>b[1]-a[1]).slice(0,14);
  const maxE=errRows.length?errRows[0][1]:1;
  const weak=TYPE_KEYS.filter(k=>acc[k].n>=3).sort((a,b)=>acc[a].c/acc[a].n-acc[b].c/acc[b].n)[0];
  const insight=weak&&acc[weak].c/acc[weak].n<0.85?`Needs the most work: ${TYPES[weak].label.toLowerCase()} (${Math.round(100*acc[weak].c/acc[weak].n)}% right).`:'No clear weak spot yet. Keep practicing.';
  const nh=Math.round(100*st.items.filter(i=>i.ok&&!i.h).length/Math.max(1,st.items.length));
  const tot=Math.round(100*st.items.filter(i=>i.ok).length/Math.max(1,st.items.length));
  const mins=Math.round(mathSess().reduce((n,s)=>n+(s.secs||0),0)/60);
  const row=k=>{const a=acc[k],p=a.n?Math.round(100*a.c/a.n):null;return`<div class="bar"><span>${esc(TYPES[k].label)}</span><span class="track2" style="position:relative"><span class="fill ${p!==null&&p<goal?'low':''}" style="width:${p||0}%"></span><i style="position:absolute;left:${goal}%;top:-3px;bottom:-3px;width:3px;background:var(--good)" aria-hidden="true"></i></span><span class="num">${p===null?'–':p+'%'}</span></div>`};
  return`<section class="card"><div class="row between"><h3>Summary</h3><button class="btn tint noprint" data-act="print">Print summary</button></div>
  <div class="perks"><div class="perk"><b>${mathSess().length}</b><span>sessions</span></div><div class="perk"><b>${mins}</b><span>minutes</span></div><div class="perk"><b>${tot}%</b><span>right overall</span></div><div class="perk"><b>${nh}%</b><span>right with no hint</span></div></div>
  <p class="mute">Right after a hint or second try counts as correct, and is logged in the mistake patterns. “No hint” counts only answers right with no help.</p></section>
  <section class="card"><h3>Score history</h3>${chart()}</section>
  <section class="card"><h3>Accuracy by skill</h3><p><b>${esc(insight)}</b></p><p class="mute">The green line marks the ${goal}% goal.</p>
  ${TYPE_KEYS.map(row).join('')}</section>
  <section class="card"><h3>Mistake patterns</h3>${errRows.length?errRows.map(([k,n])=>`<div class="bar"><span>${esc(ERR_LABEL[k]||k)}</span><span class="track2"><span class="fill low" style="width:${Math.round(100*n/maxE)}%"></span></span><span class="num">${n}</span></div>`).join(''):'<p class="mute">No mistakes recorded yet.</p>'}
  <p class="mute">Share this pattern with Emmett's teacher so school and home practice target the same step.</p></section>`;
}

function chart(list){
  const pts=(list||mathSess()).slice(0,30).reverse();
  if(pts.length<2)return`<p class="mute">The chart appears after two sessions.</p>`;
  const W=640,H=230,L=34,R=14,T=14,B=30,x=i=>L+(W-L-R)*(i/(pts.length-1)),y=p=>T+(H-T-B)*(1-p/100);
  let g='';
  [0,25,50,75,100].forEach(v=>g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`);
  g+=`<line x1="${L}" x2="${W-R}" y1="${y(80)}" y2="${y(80)}" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W-R}" y="${y(80)-5}" text-anchor="end" style="fill:var(--good)">80% goal</text>`;
  const path=pts.map((s,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(pct(s)).toFixed(1)}`).join(' ');
  g+=`<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>`;
  pts.forEach((s,i)=>{const e=s.mode==='exam';g+=`<circle cx="${x(i).toFixed(1)}" cy="${y(pct(s)).toFixed(1)}" r="${e?6:4.5}" fill="${e?'var(--accent)':'var(--card)'}" stroke="var(--accent)" stroke-width="2.5"/>`});
  g+=`<text x="${L}" y="${H-8}">${fmtDate(pts[0].ts)}</text><text x="${W-R}" y="${H-8}" text-anchor="end">${fmtDate(pts[pts.length-1].ts)}</text>`;
  return`<div class="scroll"><svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Score history chart" style="min-width:420px">${g}</svg></div><p class="mute">Filled dots are practice exams. Hollow dots are practice sessions.</p>`;
}
function logTab(){
  if(!S.sessions.length)return`<section class="card"><p class="mute">No sessions yet.</p></section>`;
  return`<section class="card"><div class="scroll"><table><thead><tr><th>Date</th><th>Mode</th><th>Score</th><th>Minutes</th><th>Where</th></tr></thead><tbody>${S.sessions.slice(0,60).map(s=>`<tr><td>${new Date(s.ts).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</td><td>${esc(sessName(s))}</td><td class="num">${s.correct}/${s.total} (${pct(s)}%)</td><td class="num">${Math.max(1,Math.round((s.secs||0)/60))}</td><td>${esc(s.home||'')}</td></tr>`).join('')}</tbody></table></div></section>`;
}

/* ---------- render + events ---------- */
let lastView=null;
function render(){
  let h;
  switch(S.view){
    case'run':h=runView();break;
    case'results':h=resultsView();break;
    case'math':h=mathView();break;
    case'fb':h=fbView();break;
    case'fbstudy':h=fbStudyView();break;
    case'nqrun':h=nqRunView();break;
    case'fdrun':h=fdRunView();break;
    case'fbres':h=fbResView();break;
    case'parent':h=parentView();break;
    case'closet':h=closetView();break;
    default:h=homeView();
  }
  $app.innerHTML=h;
  if(lastView!==S.view){window.scrollTo(0,0);lastView=S.view}
  const a=document.getElementById('ans');
  if(a&&!a.disabled)a.focus({preventScroll:true});
  const p=document.getElementById('pin');if(p)p.focus({preventScroll:true});
}
function finish(){
  const exam=run.mode==='exam',before=stats().stars,prevBest=S.sessions.reduce((m,s)=>Math.max(m,s.stars||0),0),had=S.sessions.length>0;
  const items=run.qs.map((q,i)=>{
    const st=run.st[i];
    if(exam){
      const g=run.answers[i],ok=isRight(q,g);
      return{t:q.type,k:q.kind,ok,to:timerOn()&&run.used[i]>=EXAM_SECS*1000?1:0,err:ok?null:g===''?'blank':classify(q,g),given:g};
    }
    const hintOnly=st.ok&&st.helped&&!st.err;
    return{t:q.type,k:q.kind,ok:st.ok,h:st.helped?1:0,err:st.err||(hintOnly?'Needed a hint: '+TYPES[q.type].label:null),given:st.given};
  });
  const correct=items.filter(i=>i.ok).length;
  const sess={ts:Date.now(),mode:run.mode,home:S.home||'',correct,total:items.length,secs:Math.min(7200,Math.round((Date.now()-run.t0)/1000)),stars:exam?correct*2+5:correct+3,items:items.map(i=>({t:i.t,k:i.k,ok:i.ok,h:i.h||0,to:i.to||0,err:i.err}))};
  saveSession(sess);
  const now=before+sess.stars;
  const unlocked=ITEMS.filter(it=>it.at!==null&&it.at>before&&it.at<=now).map(it=>it.name);
  const stop=STOPS.filter(p=>p.at>0&&p.at>before&&p.at<=now).map(p=>p.n);
  run.result=Object.assign({},sess,{items,unlocked,stop,hi:had&&sess.stars>prevBest});S.view='results';render();
}
function guidedSubmit(val){
  const q=run.qs[run.i],st=run.st[run.i];
  if(st.done)return;
  val=String(val).trim();if(val==='')return;
  st.tries++;st.given=val;
  if(isRight(q,val)){st.done=true;st.ok=true;st.helped=st.tries>1||st.hint;st.msg='right';st.cheer=pick(CHEERS)}
  else{
    if(!st.err)st.err=classify(q,val);
    st.wrong.push(val);st.hint=true;
    if(st.tries>=2){st.done=true;st.ok=false;st.msg='reveal'}else st.msg='retry';
  }
  render();
}
function setAv(k,v){
  const a=getAv();
  if(k==='skin'||k==='hair'||k==='outfit')a[k]=Number(v);
  else if(k==='style')a.style=v;
  else if(k==='item'){
    const it=ITEMS.find(x=>x.id===v);if(!it)return;
    if(it.slot==='extra')a.extra=a.extra.includes(v)?a.extra.filter(x=>x!==v):[...a.extra,v];
    else if(it.slot==='head')a.head=a.head===v?'':v;
    else a.top=a.top===v?'tee':v;
  }
  store.set('bl.avatar',a);touchProfile();render();
}
document.addEventListener('input',e=>{
  if(e.target.id==='ans'){
    const v=e.target.value.replace(/[^0-9a-zA-Z\/ ,.]/g,'');
    if(v!==e.target.value)e.target.value=v;
    if(run&&run.mode==='exam')run.answers[run.i]=v;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(e.target.id==='ans'&&run){e.preventDefault();if(run.mode==='exam')act('next');else guidedSubmit(e.target.value)}
  if(e.target.id==='pin')act(S.settings.pin?'unlock':'setpin');
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  act(b.dataset.act,b.dataset.v,b.dataset);
});
function act(a,v,d){
  const r=run;
  switch(a){
    case'sethome':S.home=v;store.set('bl.home',v);S.view='home';render();break;
    case'rehome':S.view='pickhome';render();break;
    case'start':start(v);break;
    case'skill':start('guided',v);break;
    case'topic':{
      const on=S.topics.includes(v)?S.topics.filter(x=>x!==v):[...S.topics,v];
      if(on.length){S.topics=on;store.set('bl.topics',on);touchProfile()}
      render();break}
    case'home':S.view='home';S.unlocked=false;run=null;render();break;
    case'exit':S.view=S.from||'home';S.unlocked=false;run=null;render();break;
    case'psub':S.psub=v;render();break;
    case'print':window.print();break;
    case'fbstart':if(v==='draft')startDraft();else startQuiz(v);break;
    case'fbstudy':S.from='fb';S.view='fbstudy';render();break;
    case'fbdiv':S.fbDiv=v;render();break;
    case'fbflip':{const o=S.fbOpen||(S.fbOpen=new Set());if(o.has(v))o.delete(v);else{o.add(v);say(teamById(v).name)}render();break}
    case'nqpick':nqPick(Number(v));render();break;
    case'nqnext':if(nq.i<nq.qs.length-1){nq.i++;render()}else finishQuiz();break;
    case'fdtoggle':fdToggle(v);render();break;
    case'fdcheck':fdCheck();render();break;
    case'fdnext':if(fd.i<fd.rounds.length-1){fd.i++;render()}else finishDraft();break;
    case'nav':S.view=v;if(v!=='parent'){S.unlocked=false}S.pinErr=false;render();break;
    case'av':setAv(d.k,v);break;
    case'tab':S.tab=v;render();break;
    case'setpin':{const el=document.getElementById('pin');if(el&&/^\d{4,8}$/.test(el.value)){S.settings.pin=el.value;store.set('bl.settings',S.settings);S.unlocked=true;S.pinErr=false}else S.pinErr=true;render();break}
    case'unlock':{const el=document.getElementById('pin');if(el&&el.value===String(S.settings.pin)){S.unlocked=true;S.pinErr=false}else S.pinErr=true;render();break}
    case'saveSettings':{
      const np=document.getElementById('newPin').value.trim();
      S.settings.examLen=Number(document.getElementById('examLen').value);
      S.settings.sessLen=Number(document.getElementById('sessLen').value);
      S.settings.goal=Number(document.getElementById('goal').value);
      S.settings.examTimer=document.getElementById('examTimer').value==='on';
      S.settings.football=document.getElementById('fbOn').value!=='off';
      if(/^\d{4,8}$/.test(np))S.settings.pin=np;
      store.set('bl.settings',S.settings);
      render();const s=document.getElementById('saved');if(s)s.textContent=np&&!/^\d{4,8}$/.test(np)?'Saved. PIN must be 4 to 8 digits, so it was not changed.':'Saved.';break}
    case'pick':
      if(r.mode==='exam'){r.answers[r.i]=v;render()}else guidedSubmit(v);break;
    case'check':{const el=document.getElementById('ans');guidedSubmit(el?el.value:'');break}
    case'hint':r.st[r.i].hint=true;render();break;
    case'prev':if(r.i>0){r.i--;render()}break;
    case'goto':r.i=Number(v);r.review=false;render();break;
    case'next':
      if(r.mode==='exam'){if(r.i<r.qs.length-1){r.i++;render()}else{r.review=true;render()}}
      else if(r.i<r.qs.length-1){r.i++;render()}else finish();
      break;
    case'begin':r.started=true;r.tickAt=Date.now();render();break;
    case'submitExam':finish();break;
  }
}
render();
initDb();
</script>
</body></html>
